name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/zenimo-pet-wellness-site-2e3iia]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /Zeuy/
      # Fallback SPA : GitHub Pages sert 404.html pour les routes profondes (/boutique, /produit/...)
      - run: cp dist/index.html dist/404.html
      - name: Publier sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
